blueprint:
  name: NHL Companion - Game reminder
  description: >
    Run actions on game day and shortly before puck drop, e.g. a phone notification or a TTS announcement.
  domain: automation
  source_url: https://github.com/BrandonMiller18/homeassistant-nhl-plugin/blob/main/custom_components/nhl_companion/blueprints/automation/game_reminder.yaml
  input:
    team:
      name: Team
      selector:
        config_entry:
          integration: nhl_companion
    actions:
      name: Actions
      description: >
        What to do. Event details are available in templates, e.g.
        {{ trigger.event.data.team_name }} vs {{ trigger.event.data.opponent_name }} at {{ trigger.event.data.start_time_local }}
      selector:
        action: {}
mode: queued
trigger:
  - trigger: event
    event_type: nhl_companion_event
    event_data:
      type: game_day
      config_entry_id: !input team
  - trigger: event
    event_type: nhl_companion_event
    event_data:
      type: game_soon
      config_entry_id: !input team
action: !input actions
