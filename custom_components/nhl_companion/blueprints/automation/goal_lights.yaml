blueprint:
  name: NHL Companion - Goal lights
  description: >
    Flash lights in your team's colors when your team scores, then restore
    them to how they were. A failed flash (e.g. a busy Zigbee radio) is
    skipped rather than stopping the show, so the lights are always restored.
  domain: automation
  source_url: https://github.com/BrandonMiller18/homeassistant-nhl-plugin/blob/main/custom_components/nhl_companion/blueprints/automation/goal_lights.yaml
  input:
    team:
      name: Team
      selector:
        config_entry:
          integration: nhl_companion
    lights:
      name: Lights
      selector:
        entity:
          domain: light
          multiple: true
    color_1:
      name: Primary color
      default: [252, 181, 20]
      selector:
        color_rgb: {}
    color_2:
      name: Secondary color
      default: [0, 0, 0]
      selector:
        color_rgb: {}
    flashes:
      name: Number of flashes
      default: 6
      selector:
        number:
          min: 1
          max: 30
    flash_ms:
      name: Flash speed
      description: >
        How long each color stays on. Below about 1000 ms, Zigbee radios can
        start dropping commands when flashing several lights.
      default: 1000
      selector:
        number:
          min: 250
          max: 5000
          step: 50
          unit_of_measurement: ms
# Queued, not restart: restarting mid-show would skip the restore and the next
# run would snapshot the flashing colors instead of the real ones.
mode: queued
max: 3
trigger:
  - trigger: event
    event_type: nhl_companion_event
    event_data:
      type: team_goal
      config_entry_id: !input team
variables:
  lights: !input lights
action:
  - action: scene.create
    data:
      scene_id: nhl_companion_goal_lights_restore
      snapshot_entities: "{{ lights }}"
  - repeat:
      count: !input flashes
      sequence:
        - action: light.turn_on
          continue_on_error: true
          target:
            entity_id: !input lights
          data:
            rgb_color: !input color_1
            brightness_pct: 100
            transition: 0
        - delay:
            milliseconds: !input flash_ms
        - action: light.turn_on
          continue_on_error: true
          target:
            entity_id: !input lights
          data:
            rgb_color: !input color_2
            brightness_pct: 100
            transition: 0
        - delay:
            milliseconds: !input flash_ms
  # Let the radio drain its queue, restore, then restore again in case the
  # first restore was dropped.
  - delay:
      seconds: 1
  - action: scene.turn_on
    continue_on_error: true
    target:
      entity_id: scene.nhl_companion_goal_lights_restore
  - delay:
      seconds: 2
  - action: scene.turn_on
    continue_on_error: true
    target:
      entity_id: scene.nhl_companion_goal_lights_restore
