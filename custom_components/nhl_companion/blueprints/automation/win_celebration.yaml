blueprint:
  name: NHL Companion - Win celebration
  description: >
    Run actions when your team wins.
  domain: automation
  source_url: https://github.com/BrandonMiller18/homeassistant-nhl-plugin/blob/main/custom_components/nhl_companion/blueprints/automation/win_celebration.yaml
  input:
    team:
      name: Team
      selector:
        config_entry:
          integration: nhl_companion
    actions:
      name: Actions
      description: >
        What to do. Event details are available in templates, e.g.
        Final {{ trigger.event.data.score.team }}-{{ trigger.event.data.score.opponent }} vs {{ trigger.event.data.opponent_abbrev }}
      selector:
        action: {}
mode: queued
trigger:
  - trigger: event
    event_type: nhl_companion_event
    event_data:
      type: game_end_win
      config_entry_id: !input team
action: !input actions
