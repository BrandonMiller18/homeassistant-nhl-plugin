blueprint:
  name: NHL Companion - Goal announcement
  description: >
    Run any actions on a team goal with scorer details, e.g. show the scorer on a display or send a notification.
    The NHL usually adds assists 20-40 s after a goal first appears, so the first goal event often has none.
    Turn on "Also run on corrections" to run again with the corrected scorer and assists.
  domain: automation
  source_url: https://github.com/BrandonMiller18/homeassistant-nhl-plugin/blob/main/blueprints/automation/nhl_companion/goal_announcement.yaml
  input:
    team:
      name: Team
      selector:
        config_entry:
          integration: nhl_companion
    include_updates:
      name: Also run on corrections
      description: >
        Run again when the scorer or assists of a team goal change after it was announced
        (event type goal_updated; trigger.event.data.changed lists what changed).
      default: false
      selector:
        boolean: {}
    actions:
      name: Actions
      description: >
        What to do. Event details are available in templates, e.g.
        {{ trigger.event.data.scorer.name }} ({{ trigger.event.data.primary_assist.name if trigger.event.data.primary_assist else 'unassisted' }})
      selector:
        action: {}
mode: queued
variables:
  include_updates: !input include_updates
trigger:
  - trigger: event
    event_type: nhl_companion_event
    event_data:
      type: team_goal
      config_entry_id: !input team
  - trigger: event
    event_type: nhl_companion_event
    event_data:
      type: goal_updated
      side: team
      config_entry_id: !input team
condition:
  - condition: template
    value_template: "{{ trigger.event.data.type == 'team_goal' or include_updates }}"
action: !input actions
